<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ahead — the sky, before it happens</title>
<meta name="description" content="A quiet little forecast app: current conditions, key upcoming weather moments, and an hourly timeline you can scrub through." />
<meta name="theme-color" content="#e08a3c" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ahead" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.location-search{ position:relative; padding: 8px 22px 0; }
#cityInput{
  width:100%; padding:8px 12px; border-radius:10px;
  border:1px solid var(--ink-dim); background:transparent; color:var(--ink); font-size:14px;
}
.location-results{ position:absolute; left:22px; right:22px; top:100%; z-index:10; }
.location-results button{
  display:block; width:100%; text-align:left; padding:8px 10px;
  background: var(--to); border-bottom:1px solid var(--ink-dim); font-size:13px;
}
  :root{
    --from:#8ec9ea; --to:#fef3d8; --accent:#e08a3c; --ink:#1b140c; --ink-dim: rgba(27,20,12,0.55);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    font-family:'Inter',-apple-system,sans-serif;
    min-height:100dvh;
    background: linear-gradient(160deg, var(--from), var(--to));
    color: var(--ink);
    transition: background 1s ease, color 0.6s ease;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; touch-action:manipulation; }
  button:focus-visible, .now-pill:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

  .top{ padding: 20px 22px 6px; display:flex; }
  .top{ justify-content: space-between; align-items:flex-start; }
  .now-pill{
    display:inline-flex; align-items:center; gap:8px;
    padding: 7px 13px;
    border: 1px solid var(--ink-dim);
    border-radius: 999px;
    opacity: 0.55;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .now-pill:active{ transform: scale(0.97); }
  .now-pill.expanded{ opacity: 1; }
  .now-pill svg{ width:16px; height:16px; }
  #nowIcon svg{ stroke-dasharray: 2 3; }
  .unit-toggle{
    padding: 7px 12px;
    border: 1px solid var(--ink-dim);
    border-radius: 999px;
    font-size: 12px;
    opacity: 0.5;
    transition: opacity 0.2s ease, transform 0.15s ease;
  }
  .unit-toggle:active{ transform: scale(0.94); }
  .now-pill .now-temp{ font-weight:600; font-size:13px; }
  .now-pill .now-label{ font-size:13px; color: var(--ink-dim); }
  .now-extra{
    max-width:0; overflow:hidden; white-space:nowrap; font-size:12px; opacity:0;
    transition: max-width 0.35s ease, opacity 0.25s ease, margin 0.35s ease;
  }
  .now-pill.expanded .now-extra{ max-width:220px; opacity:1; margin-left:2px; }

  .chips{
    display:flex; gap:8px; padding: 10px 22px 0; overflow-x:auto; scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex: 0 0 auto;
    padding: 7px 13px;
    border: 1px solid var(--ink-dim);
    border-radius: 12px;
    font-size: 12.5px;
    color: var(--ink);
    opacity: 0.75;
    transition: opacity 0.2s ease, transform 0.15s ease, background 0.2s ease;
  }
  .chip:active{ transform: scale(0.96); }
  .chip.active{ opacity:1; background: rgba(255,255,255,0.35); }

  main.hero{
    flex: 1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap: 6px; padding: 0 24px;
  }
  .hero-icon{ width: 64px; height: 64px; color: var(--accent); margin-bottom: 4px; transition: color 0.6s ease; }
  .hero-icon svg{ width:100%; height:100%; }
  .hero-trend{
    font-size: 13.5px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--accent); margin-bottom: 2px; transition: color 0.6s ease;
  }
  .hero-temp{
    font-family:'Fraunces', serif; font-weight:600;
    font-size: clamp(64px, 20vw, 118px);
    line-height: 0.95; letter-spacing: -0.02em;
  }
  .hero-label{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    font-size: clamp(19px, 4.5vw, 24px);
    color: var(--ink);
  }
  .hero-time{ font-size: 13.5px; color: var(--ink-dim); margin-top: 2px; }
  .fallback-note{ font-size: 11.5px; color: var(--ink-dim); margin-top: 10px; max-width: 260px; }

  footer.timeline{ padding: 4px 20px 26px; }
  #sparkline{ width:100%; height:76px; display:block; touch-action:none; cursor:grab; }
  #sparkline:active{ cursor:grabbing; }
  .spark-path{ fill:none; stroke: var(--ink); stroke-opacity:0.28; stroke-width:1.6; }
  .spark-fill{ fill: var(--ink); opacity:0.06; }
  .spark-marker{ fill: var(--accent); stroke: var(--to); stroke-width:2.5; transition: cx 0.15s ease, cy 0.15s ease; }
  .ticks{ display:flex; justify-content:space-between; margin-top:2px; font-size:11.5px; color: var(--ink-dim); padding: 0 2px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="location-search" id="locationSearch">
  <input type="text" id="cityInput" placeholder="Search a city…" autocomplete="off" />
  <div class="location-results" id="locationResults"></div>
</div>
  <div class="top">
    <button class="now-pill" id="nowPill" aria-label="Current conditions">
      <span id="nowIcon"></span>
      <span class="now-label">Now</span>
      <span class="now-temp" id="nowTemp">--°</span>
      <span class="now-extra" id="nowExtra"></span>
    </button>
    <button class="unit-toggle" id="unitToggle" aria-label="Switch temperature unit">°F</button>
  </div>

  <div class="chips" id="chips"></div>

  <main class="hero" id="heroPanel">
    <div class="hero-trend" id="heroTrend"></div>
    <div class="hero-icon" id="heroIcon"></div>
    <div class="hero-temp" id="heroTemp">--°</div>
    <div class="hero-label" id="heroLabel">Reading the sky…</div>
    <div class="hero-time" id="heroTime"></div>
    <div class="fallback-note" id="fallbackNote" style="display:none;">Showing a default location — allow location access in your browser for your own forecast.</div>
  </main>

  <footer class="timeline">
    <svg id="sparkline" viewBox="0 0 300 76" preserveAspectRatio="none"></svg>
    <div class="ticks" id="ticks"></div>
  </footer>

<script>
(function(){
  const DEFAULT_LOC = { lat: 40.7128, lon: -74.0060 }; // fallback: New York

  // ---------- icons ----------
  const ICONS = {
    sun: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="24" cy="24" r="9"/><path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.5 9.5l4.2 4.2M34.3 34.3l4.2 4.2M9.5 38.5l4.2-4.2M34.3 13.7l4.2-4.2"/></svg>',
    cloudSun: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="6"/><path d="M16 5v3M6 16h3M8.5 8.5l2 2"/><path d="M15 34a8 8 0 0 1 1-16 9 9 0 0 1 17 3.5A7 7 0 0 1 32 34H15z"/></svg>',
    cloud: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 34a8.5 8.5 0 0 1 1-17 10 10 0 0 1 19 4A7.5 7.5 0 0 1 32 34H13z"/></svg>',
    fog: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 18h32M8 26h24M8 34h32M20 10h16"/></svg>',
    rain: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 27a8 8 0 0 1 1-16 9 9 0 0 1 17 3.5A7 7 0 0 1 31 27H13z"/><path d="M16 33l-2 6M24 33l-2 6M32 33l-2 6"/></svg>',
    snow: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 25a8 8 0 0 1 1-16 9 9 0 0 1 17 3.5A7 7 0 0 1 31 25H13z"/><path d="M17 34v6M17 37l-3 1.5M17 37l3 1.5M31 34v6M31 37l-3 1.5M31 37l3 1.5"/></svg>',
    storm: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 24a8 8 0 0 1 1-16 9 9 0 0 1 17 3.5A7 7 0 0 1 31 24H13z"/><path d="M25 30l-6 9h6l-4 7"/></svg>'
  };

  // ---------- weather code -> meaning ----------
  function meta(code){
    const table = {
      0:['clear','Clear sky'], 1:['clear','Mostly clear'], 2:['cloudSun','Partly cloudy'], 3:['cloud','Overcast'],
      45:['fog','Fog'], 48:['fog','Freezing fog'],
      51:['rain','Light drizzle'], 53:['rain','Drizzle'], 55:['rain','Dense drizzle'],
      56:['rain','Freezing drizzle'], 57:['rain','Freezing drizzle'],
      61:['rain','Light rain'], 63:['rain','Rain'], 65:['rain','Heavy rain'],
      66:['rain','Freezing rain'], 67:['rain','Freezing rain'],
      71:['snow','Light snow'], 73:['snow','Snow'], 75:['snow','Heavy snow'], 77:['snow','Snow grains'],
      80:['rain','Rain showers'], 81:['rain','Rain showers'], 82:['rain','Violent showers'],
      85:['snow','Snow showers'], 86:['snow','Snow showers'],
      95:['storm','Thunderstorm'], 96:['storm','Thunderstorm with hail'], 99:['storm','Thunderstorm with hail']
    };
    return table[code] || ['cloud','Unsettled'];
  }

  const PALETTES = {
    clear_day:   { from:'#8ec9ea', to:'#fef3d8', accent:'#e08a3c', ink:'#1b140c' },
    clear_night: { from:'#0b1130', to:'#232a52', accent:'#f5c451', ink:'#f6f2e8' },
    cloud_day:   { from:'#9aa7b0', to:'#dbe1e4', accent:'#5c6b74', ink:'#1c2226' },
    cloud_night: { from:'#1c2128', to:'#3a4048', accent:'#9fb2bb', ink:'#f2f4f5' },
    fog_any:     { from:'#b9c2c8', to:'#e8ecee', accent:'#5f6d75', ink:'#20272b' },
    rain_day:    { from:'#4b5a6d', to:'#8b9bae', accent:'#e4edf7', ink:'#f5f8fb' },
    rain_night:  { from:'#141a26', to:'#2c3648', accent:'#87abcc', ink:'#f0f3f7' },
    snow_any:    { from:'#c9d6de', to:'#f0f4f6', accent:'#5c7b8c', ink:'#1d2a31' },
    storm_any:   { from:'#232838', to:'#4a4358', accent:'#f2c14e', ink:'#f5f2ea' }
  };
  function paletteFor(cat, isDay){
    if(cat==='fog') return PALETTES.fog_any;
    if(cat==='snow') return PALETTES.snow_any;
    if(cat==='storm') return PALETTES.storm_any;
    const suffix = isDay ? '_day' : '_night';
    if(cat==='clear') return PALETTES['clear'+suffix];
    return PALETTES[(cat==='cloudSun'?'cloud':'cloud')+suffix];
  }
  function iconFor(cat){ return ICONS[cat] || ICONS.cloud; }

  // ---------- state ----------
    let hourly = null; // {time[], temp[], code[], precip[], isDay[] — all Celsius}
  let current = null;
  let currentTimezone = 'UTC';
  let selected = 1;
  let unit = (navigator.language || 'en-US').toUpperCase().includes('US') ? 'F' : 'C';


  function formatTemp(celsius){
    const v = unit === 'C' ? celsius : celsius * 9/5 + 32;
    return Math.round(v) + '°' + unit;
  }

  const $ = id => document.getElementById(id);
  const root = document.documentElement;

    function fmtHour(iso){
    const d = new Date(iso);
    return d.toLocaleTimeString([], {
      hour: 'numeric',
      hour12: true,
      timeZone: currentTimezone || undefined
    });
  }


  function applyPalette(p){
    root.style.setProperty('--from', p.from);
    root.style.setProperty('--to', p.to);
    root.style.setProperty('--accent', p.accent);
    root.style.setProperty('--ink', p.ink);
    root.style.setProperty('--ink-dim', p.ink + 'cc');
  }

  function trendPhrase(i){
    if(i===0) return 'Right now';
    const cat = meta(hourly.code[i])[0];
    const curCat = meta(current.code)[0];
    const delta = hourly.temp[i] - current.temp; // Celsius, unit-agnostic
    if((cat==='rain'||cat==='storm') && curCat!=='rain' && curCat!=='storm') return 'Rain arrives';
    if(cat==='snow' && curCat!=='snow') return 'Snow arrives';
    if(delta <= -1.7) return 'Cooling down';
    if(delta >= 1.1) return 'Warming up';
    return 'Holding steady';
  }

  function render(){
    if(!hourly) return;
    const i = selected;
    const [cat, label] = meta(hourly.code[i]);
    const p = paletteFor(cat, hourly.isDay[i]);
    applyPalette(p);

    $('heroIcon').innerHTML = iconFor(cat);
    $('heroTrend').textContent = trendPhrase(i);
    $('heroTemp').textContent = formatTemp(hourly.temp[i]);
    $('heroLabel').textContent = label;
    const deltaC = hourly.temp[i]-current.temp;
    const deltaMag = Math.abs(unit==='C' ? deltaC : deltaC*9/5);
    $('heroTime').textContent = i===0 ? 'Right now' : fmtHour(hourly.time[i]) + ' · ' + Math.round(deltaMag) + '° ' + (deltaC>=0 ? 'warmer' : 'colder') + ' than now';

    document.querySelectorAll('.chip').forEach(c=>{
      c.classList.toggle('active', Number(c.dataset.idx)===i);
    });

    drawMarker();
  }

  function renderNowBadge(){
    const [cat, label] = meta(current.code);
    $('nowIcon').innerHTML = iconFor(cat);
    $('nowTemp').textContent = formatTemp(current.temp);
    $('nowExtra').textContent = '· ' + label + (current.wind!=null ? (', ' + Math.round(current.wind) + ' km/h') : '');
  }

  function findMoments(){
    const found = [];
    for(let i=1;i<hourly.time.length;i++){
      if(hourly.precip[i] >= 50 && hourly.precip[i-1] < 50){ found.push({idx:i, text:'Rain likely ' + fmtHour(hourly.time[i])}); break; }
    }
    let peakIdx = 1;
    for(let i=1;i<hourly.time.length;i++){ if(hourly.temp[i] > hourly.temp[peakIdx]) peakIdx = i; }
    if(hourly.temp[peakIdx] - current.temp >= 1.1){ found.push({idx:peakIdx, text:'Peak ' + formatTemp(hourly.temp[peakIdx]) + ' ' + fmtHour(hourly.time[peakIdx])}); }
    for(let i=1;i<hourly.time.length;i++){
      if(hourly.temp[i] - hourly.temp[i-1] <= -1.7){ found.push({idx:i, text:'Turns colder ' + fmtHour(hourly.time[i])}); break; }
    }
    if(found.length===0){ found.push({idx: hourly.time.length-1, text:'Steady through tomorrow'}); }
    return found;
  }

  function buildChips(){
    const box = $('chips'); box.innerHTML = '';
    findMoments().slice(0,3).forEach(f=>{
      const b = document.createElement('button');
      b.className='chip'; b.dataset.idx=f.idx; b.textContent=f.text;
      b.addEventListener('click', ()=>{ selected=f.idx; render(); });
      box.appendChild(b);
    });
  }

  // ---------- sparkline ----------
  let sparkGeom = null;
  function drawSparkline(){
    const svg = $('sparkline');
    const w=300, h=76, pad=8;
    const temps = hourly.temp;
    const min = Math.min(...temps), max = Math.max(...temps);
    const range = (max-min) || 1;
    const n = temps.length;
    const pts = temps.map((t,i)=>{
      const x = (i/(n-1))*w;
      const y = h - pad - ((t-min)/range)*(h-2*pad);
      return [x,y];
    });
    sparkGeom = { pts, n };
    const d = pts.map((pt,i)=> (i===0?'M':'L') + pt[0].toFixed(1) + ',' + pt[1].toFixed(1)).join(' ');
    const fillD = d + ` L${w},${h} L0,${h} Z`;
    svg.innerHTML = `<path class="spark-fill" d="${fillD}"/><path class="spark-path" d="${d}"/><circle class="spark-marker" r="4.5" cx="0" cy="0"/>`;
    drawMarker();

    const ticks = $('ticks'); ticks.innerHTML='';
    [0, Math.round((n-1)/3), Math.round((n-1)*2/3), n-1].forEach(i=>{
      const s = document.createElement('span');
      s.textContent = i===0 ? 'Now' : fmtHour(hourly.time[i]);
      ticks.appendChild(s);
    });
  }
  function drawMarker(){
    if(!sparkGeom) return;
    const m = document.querySelector('.spark-marker');
    if(!m) return;
    const pt = sparkGeom.pts[selected];
    m.setAttribute('cx', pt[0]); m.setAttribute('cy', pt[1]);
  }
  function wireSparklineInput(){
    const svg = $('sparkline');
    let dragging = false;
    function pick(clientX){
      const rect = svg.getBoundingClientRect();
      const frac = Math.min(1, Math.max(0, (clientX-rect.left)/rect.width));
      const idx = Math.round(frac*(sparkGeom.n-1));
      if(idx !== selected){ selected = idx; render(); }
    }
    svg.addEventListener('pointerdown', e=>{ dragging=true; pick(e.clientX); });
    window.addEventListener('pointermove', e=>{ if(dragging) pick(e.clientX); });
    window.addEventListener('pointerup', ()=>{ dragging=false; });
  }

  // ---------- data ----------
  async function loadWeather(lat, lon, isFallback){
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
  `&current=temperature_2m,weather_code,is_day,wind_speed_10m` +
  `&hourly=temperature_2m,weather_code,precipitation_probability,is_day` +
  `&timezone=auto&forecast_days=2`;

    const res = await fetch(url);
    const data = await res.json();

        currentTimezone = data.timezone;

    current = {
      temp: data.current.temperature_2m,
      code: data.current.weather_code,
      isDay: data.current.is_day === 1,
      wind: data.current.wind_speed_10m
    };

    let baseIdx = data.hourly.time.indexOf(data.current.time);
    if (baseIdx === -1) {
      const currentPrefix = data.current.time.slice(0, 13);
      baseIdx = data.hourly.time.findIndex(t => t.startsWith(currentPrefix));
      if (baseIdx === -1) baseIdx = 0;
    }

    const end = baseIdx + 24;
    hourly = {
      time: data.hourly.time.slice(baseIdx, end),
      temp: data.hourly.temperature_2m.slice(baseIdx, end),
      code: data.hourly.weather_code.slice(baseIdx, end),
      precip: data.hourly.precipitation_probability.slice(baseIdx, end),
      isDay: data.hourly.is_day.slice(baseIdx, end).map(v=>v===1)
    };

    $('fallbackNote').style.display = isFallback ? 'block' : 'none';
    renderNowBadge();
    buildChips();
    drawSparkline();
    wireSparklineInput();
    selected = 0;
render();
  }

  function init(){
    if(!navigator.geolocation){
      loadWeather(DEFAULT_LOC.lat, DEFAULT_LOC.lon, true);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => loadWeather(pos.coords.latitude, pos.coords.longitude, false),
      () => loadWeather(DEFAULT_LOC.lat, DEFAULT_LOC.lon, true),
      { timeout: 8000 }
    );
  }

  // now pill expand/collapse
  let collapseTimer;
  $('nowPill').addEventListener('click', ()=>{
    const el = $('nowPill');
    el.classList.toggle('expanded');
    clearTimeout(collapseTimer);
    if(el.classList.contains('expanded')){
      collapseTimer = setTimeout(()=> el.classList.remove('expanded'), 3000);
    }
  });

  // unit toggle — shows the other unit as the button label
  $('unitToggle').textContent = unit === 'C' ? '°F' : '°C';
  $('unitToggle').addEventListener('click', ()=>{
    unit = unit === 'C' ? 'F' : 'C';
    $('unitToggle').textContent = unit === 'C' ? '°F' : '°C';
    if(hourly){ renderNowBadge(); buildChips(); render(); }
  });

  // story-style swipe: swipe left/right on the hero to step through hours
  (function wireSwipe(){
    const panel = $('heroPanel');
    let startX = null;
    panel.addEventListener('touchstart', e=>{ startX = e.touches[0].clientX; }, {passive:true});
    panel.addEventListener('touchend', e=>{
      if(startX===null || !hourly) return;
      const dx = e.changedTouches[0].clientX - startX;
      startX = null;
      if(Math.abs(dx) < 40) return;
      const dir = dx < 0 ? 1 : -1; // swipe left = forward in time
      selected = Math.min(hourly.time.length-1, Math.max(0, selected + dir));
      render();
    }, {passive:true});
  })();

  async function searchCity(query){
    if(query.length < 2){ $('locationResults').innerHTML=''; return; }
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5`);
    const data = await res.json();
    const box = $('locationResults'); box.innerHTML = '';
    (data.results || []).forEach(place => {
      const b = document.createElement('button');
      b.textContent = `${place.name}, ${place.admin1 || ''} ${place.country || ''}`;
      b.addEventListener('click', () => {
        loadWeather(place.latitude, place.longitude, false);
        box.innerHTML = '';
        $('cityInput').value = place.name;
      });
      box.appendChild(b);
    });
  }

  let searchTimer;
  $('cityInput').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => searchCity(e.target.value), 300);
  });

  init();
})();

// register service worker for offline/installable support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
